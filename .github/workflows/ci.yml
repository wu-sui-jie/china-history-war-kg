name: ci

# 每次 push / PR 都跑：**不依赖 data/ 下的大制品**（快照与索引不入库）。
# 浏览器用例走 frontend 里的桩后端（scripts/e2e-server.mjs），因此在这里也能跑真实
# Chromium；需要完整数据链路的发布门禁在 release.yml，由 workflow_dispatch / tag 触发。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rag:
    # 键名是 `rag`，不是 `backend`（第 14 轮审计 P3-17）：这个 job 的
    # working-directory 是 RAG、跑的是 RAG 的测试，而键名叫 backend 会让状态列表里
    # 那条绿色的 `backend (3.11)` 被读成"旧后端已在 3.11 上通过"——旧后端自己的测试
    # 在 legacy-backend job 里（该 job 另有 backend-py311 这一档）。名字与实际一致，
    # 才不会在下一次"给旧后端加 3.11 job"时被自己骗过去。
    name: RAG（测试 + 发布守护）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG
    strategy:
      fail-fast: false
      matrix:
        # 正式支持的运行版本：Python 3.11（锁文件即按 3.11 生成，带 hashes）。
        # 3.9 只做语法兜底检查，见 syntax-floor job。
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖（锁文件优先）
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.lock ]; then
            if grep -q -- '--hash=' requirements-dev.lock; then
              # 锁文件带哈希：按供应链要求强制校验（P2-6 验收）
              python -m pip install --require-hashes -r requirements-dev.lock
            else
              echo "::warning::requirements-dev.lock 不含 --hash=，暂时按普通模式安装（见 docs/current-status.md）"
              python -m pip install -r requirements-dev.lock
            fi
          else
            python -m pip install -r requirements-dev.txt
          fi
      - name: 收集用例数（写入日志，供文档引用真实数字）
        run: python -m pytest tests -q --collect-only | tail -3
      - name: 全量测试
        run: python -m pytest tests -q
      - name: 守护用例（发布阻断 + 在线链路）
        run: python -m pytest tests/test_release_guards.py tests/test_online_guards.py -q
      - name: 脚本语法编译（全部 Python 源码）
        run: python -m compileall -q server config contracts lib data scripts evaluation tests

  syntax-floor:
    # 语法兜底（原 3.9 矩阵的意图）：确认代码不依赖新语法，不需要装依赖。
    # 依赖矩阵只支持 3.11（chromadb 依赖树要求 ≥3.10），把"语法兼容"与
    # "依赖可安装"分开声明，避免出现一份 lock 谁都用不了的矩阵（第五轮审核 P2-6）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: 语法检查（3.9 解释器，不安装依赖）
        run: python -m compileall -q server config contracts lib data scripts evaluation tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: RAG/frontend/package-lock.json
      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试（SSE / 状态机 / 持久化）
        run: npm run test:unit
      - name: 组件测试（Vue Test Utils）
        run: npm run test:component
      - name: 构建
        run: npm run build
      - name: 首屏体积门禁（含"不预加载 ECharts/地图"）
        run: npm run check:bundle

  browser:
    # 浏览器验收（第五轮审核 P1-12 / P1-13）：desktop + mobile 两套 project，
    # 跑在桩后端上，因此不需要 data/ 也能在普通 CI 里执行。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: RAG/frontend/package-lock.json
      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 构建前端（桩后端托管 dist/）
        run: npm run build
      - name: 浏览器验收（桩后端 + Playwright desktop/mobile）
        run: npm run test:e2e:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: RAG/frontend/playwright-report/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖（锁文件优先）
        # DOC-6 / 第 11 轮 C-9：这里原先直接装 requirements-dev.txt，与上面 backend job 的
        # "锁文件 + --require-hashes" 口径不一致——同一条供应链要求，两个 job 两套做法。
        # 现在两边共用同一段逻辑：有带哈希的锁就强制校验，锁缺失/无哈希时降级并告警。
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.lock ]; then
            if grep -q -- '--hash=' requirements-dev.lock; then
              python -m pip install --require-hashes -r requirements-dev.lock
            else
              echo "::warning::requirements-dev.lock 不含 --hash=，暂时按普通模式安装（见 docs/current-status.md）"
              python -m pip install -r requirements-dev.lock
            fi
          else
            python -m pip install -r requirements-dev.txt
          fi
      - name: 锁文件必须带哈希（P2-6 门禁）
        run: python scripts/lock_hashes.py --check
      - name: 全仓统一 lock 的形态校验（第 14 轮审计 §5.8 门禁）
        # 查三件不能出现在锁文件里的东西：本机绝对路径、写死的镜像地址、本仓库自引用。
        # 它们都能让锁"看起来存在"，而别人照着装必然失败。
        # 用绝对路径调脚本（脚本自己按 __file__ 定位仓库根），不依赖 cwd——
        # 本 job 的默认工作目录是 RAG，写相对路径会指到 RAG/scripts 下去。
        run: python "$GITHUB_WORKSPACE/scripts/gen_unified_lock.py" --check
      - name: 静态检查（Ruff：语法错误 / 未定义名 / 无占位 f-string / 导入位置）
        # 第 12 轮审查 P2-9：这个 job 名叫 `lint`，实际却没执行 Ruff——审查当次完整 Ruff 检查
        # 发现 7 项（6 个 F541 + 1 个 E402），本次全部修掉。门禁缺位的代价是
        # 「已修复」只在本机成立，下一次提交同样能悄悄带回来。
        #
        # 版本与规则集（第 14 轮审计 E-7 / P3-12）：版本统一为 0.16.8——**前提是根
        # pyproject.toml 已有显式 `[tool.ruff] select = ["E4","E7","E9","F"]`**。
        # 在此之前"把 0.14.4 升到 0.16.8"会让本 job 从 0 错变成 480 错：仓库原先
        # 没有任何 ruff 配置，两个版本各用自己的默认规则集，而默认集在两者之间扩大了。
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.16.8"
          python -m ruff check server config contracts lib data scripts evaluation tests
      - name: 文档链接 / current 口径 / .env.example 一致性 / 数据计数
        run: python scripts/check_docs.py --strict
      - name: 密钥扫描（RAG 范围）
        run: python scripts/check_secrets.py
      - name: 空白与冲突标记检查
        run: git diff --check

  secret-scan:
    # 全仓库密钥扫描（第 12 轮审查 P0-2 / P2-8）。
    #
    # 原先只有两处零散的扫描：RAG 的 check_secrets.py 根目录写死为 RAG/，旧模块 CI 的 grep
    # 只扫 backend 与 entity-event-relation。于是 deploy/env/*.env（部署模板）、feishu-bot/、
    # 工作流文件与根级脚本全在门禁之外——固定口令与 JWT 密钥曾经就躺在 deploy/env/backend.env 里，
    # 谁都没拦住。这里把同一份实现提到仓库根跑一遍，扫描范围 = 整个工作区。
    #
    # 只扫入库内容：.env 等本地文件按约定跳过后缀，data/ logs/ node_modules/ dist/ 等
    # 运行期与构建目录也在脚本的跳过清单里。
    name: 全仓库密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 扫描整个仓库
        run: python RAG/scripts/check_secrets.py --root .

  feishu-bot:
    # 飞书机器人进 CI（第 12 轮审查 P2-4）。
    #
    # 机器人本地 297 项用例全通过（原写 279，第 14 轮审计 P3-12 实测更正），
    # 但此前 CI 里没有任何 job 覆盖它——后续提交可以在全绿的情况下把机器人改坏。依赖独立在两处：lark-oapi 版本被刻意锁死（长连接对卡片
    # 回调帧的分发是 SDK 内部实现细节，升级会静默改行为），所以这里装的是它自己的
    # requirements.txt，不共用 RAG 的锁文件。
    name: 飞书机器人（测试 + 静态检查）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feishu-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: feishu-bot/requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 静态检查（Ruff，含未使用导入）
        # 与 RAG 的 lint job 同版本，避免同一个仓库两套判定
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.16.8"
          python -m ruff check .
      - name: 安装出图依赖（子图渲染用例需要）
        # 为什么在 CI 里装：runner 自带 node 却没有 render/node_modules，而
        # test_render_subgraph.py 里需要**真实渲染**的那几个用例只有在依赖齐备时才跑得起来。
        # 原先只在 Python 侧判断 `shutil.which("node")`，"有 node 但没依赖"的 CI 环境
        # 会走到产品代码后被"缺少 Node 依赖"提前拦下 —— 一条用例因此在 CI 上红了很久
        # （本机装了依赖所以一直是绿的）。现在：CI 装依赖跑全量，用例侧也统一按
        # renderer.is_available()（node + 依赖 + 脚本）判断，两边口径一致。
        # 用 cd 而不是 working-directory：本 job 的默认工作目录已经是 feishu-bot，
        # step 级 working-directory 的解析基准容易读错，显式 cd 没有歧义。
        run: cd render && npm ci --no-audit --no-fund
      - name: 单元与集成用例（含子图渲染降级）
        # tests/test_render_subgraph.py 覆盖 render_subgraph.js 缺失 / Node 不可用 / 超时
        # 三条降级路径——部署机不一定装了 Node，脚本本身会走降级分支。
        run: python -m pytest tests -q

  legacy-backend:
    # 旧后端与离线抽取：原先零 CI（约一半代码无自动化验证）。
    # 语法与未定义名这类低级事故由 compileall + ruff 兜住（不装依赖）；
    # 账户提权 / 菜单裁剪 / 提权链路 / 抽取失败口径另有一组常驻 pytest
    # （backend/tests，第 6 轮审核 H4：此前只有一次性脚本，脚本跑完即删）。
    #
    # 刻意钉在 22.04：Python 3.8 已 EOL，ubuntu-24.04 镜像上 actions/setup-python 不再提供它
    # （用 ubuntu-latest 会直接报 "Version 3.8 was not found" 而失败）。
    #
    # **双跑 3.8 与 3.11**（第 14 轮审计 §5.7）：3.11 环境在本机已实测四套测试全绿
    # （backend 200 / EER 109 / RAG 441 / 飞书 297），但"本机通过"不等于 CI 通过——
    # 依赖解析结果、py2neo 这样的旧包、乃至 pytest 版本都可能不同。两档都绿并稳定一段时间后，
    # 再按方案 §5.10 删掉 3.8 那一档（该步骤明确要等 lock 与文档切换完成，本轮不做）。
    #
    # 命名刻意带 Python 版本：状态列表里要看得出"哪一档挂了"，也避免与 rag job 混淆
    # （那个 job 曾叫 backend，见 P3-17）。
    name: 旧后端与知识抽取（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 语法编译（backend + entity-event-relation，目标解释器为 3.8）
        # 目标版本固定 py38：这不是"用当前解释器编译"，而是"确认代码不依赖 3.8 之后的语法"。
        # 3.11 那一档跑它同样有意义（3.11 能编译 → 不代表 3.8 能）。
        run: python -m compileall -q backend entity-event-relation
      - name: 静态检查（ruff F821：未定义名）
        # compileall 只验语法，查不出"函数被删掉但调用还在"这类 NameError。
        # 该门禁原先只在实施者本机跑过（第 3 轮审核第 3 条），这里固化进 CI；
        # ruff 版本钉死，避免升级后判定变化导致门禁口径漂移。
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.16.8"
          python -m ruff check --select F821 --target-version py38 backend entity-event-relation
      - name: 安装旧后端运行依赖（根 requirements.txt + 抽取链包）
        # 之前这一步是不装的：只有语法检查就没必要。现在要真跑用例，就得装
        # （app.py 导入链要吃 Flask/pydantic/openai/fuzzywuzzy 等）。
        # 抽取链是正式包 war_extraction（P2-4），以可编辑方式装上——backend 不再往
        # sys.path 里塞目录；少了这一步，导入 app 会直接 ModuleNotFoundError。
        # py2neo 虽然装了，但被测代码会用到它——conftest 在导入 app 之前把
        # py2neo.Graph 打桩，测试不会去连真 Neo4j。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install -e entity-event-relation
      - name: 常驻测试（鉴权 / 菜单裁剪 / 提权链路 / 抽取失败口径）
        # 两条断言，任一条不过都算失败：
        #   1. 全绿；
        #   2. **不再出现 SQLAlchemy 的 LegacyAPIWarning**（方案 §5.5 的验收标准）。
        #      第 14 轮审计前的 10 处 `Model.query.get(id)` 已全部改成 `db.session.get(...)`，
        #      这里把它固化成门禁——否则下一处新写的 `query.get()` 只会在日志里告警，
        #      而"告警不算失败"正是它当初能积累 10 处的原因。
        working-directory: backend
        # 退出码必须自己算：`pytest | tee` 这种管道在 bash 里只看**最后一条命令**的
        # 退出状态，而 tee 永远成功——直接写管道会让"测试挂了"被静默吞掉，
        # 门禁变成一句装饰（这一步的写法比它检查的东西更容易出错，所以写显式些）。
        run: |
          set +e
          python -m pytest tests -q 2>&1 | tee /tmp/pytest-backend.log
          status=${PIPESTATUS[0]}
          if grep -q "LegacyAPIWarning" /tmp/pytest-backend.log; then
            echo "::error::出现 SQLAlchemy LegacyAPIWarning：请把 Query.get() 改成 db.session.get(Model, id)"
            status=1
          fi
          exit ${status}
      - name: 抽取链常驻测试（评估可复现 / 地名噪声正则 / 缓存原子写）
        # 抽取链此前在 CI 里只有 compileall + ruff，零用例——"评估可复现"这类口径没有回归
        # 保护：第 7 轮就实测到同一输入两次评估指标不同，一路拖到第 9 轮才定位（EER-15）。
        # 三条用例分别钉住 EER-15 / EER-4 / EER-11，都是先确认"修前失败"才入库的；
        # 评估可复现那条开 4 个不同 PYTHONHASHSEED 的子进程比对，钉死种子蒙不过去。
        working-directory: entity-event-relation
        run: python -m pytest tests -q
      - name: 旧后端不得出现明文密钥
        run: |
          # 与 RAG 的 check_secrets.py 同口径：只看明显的密钥形态，放过占位符
          if grep -rInE "(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{12,})" \
              --include='*.py' --include='*.json' --include='*.md' backend entity-event-relation; then
            echo "::error::检测到疑似明文密钥"
            exit 1
          fi
          echo "未发现明文密钥"
      - name: 关键文件存在性（防止误删）
        run: |
          for f in backend/app.py backend/local_settings.py backend/.env.example \
                   backend/requirements.txt backend/rules/rule_base.json; do
            test -f "$f" || { echo "::error::缺少 $f"; exit 1; }
          done

  legacy-frontend:
    # 旧前端（管理台）：原先零 CI。类型检查在 2026-09 修复过（vue 3.5 需要 TS 5.x，
    # tsconfig 补 skipLibCheck/allowJs），现在可以进 CI 了。
    name: 旧前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 构建 + 产物资源路径检查
        # build:check 末尾挂着 scripts/check-dist-assets.mjs（第 12 轮审查 P1-4）：
        # public/ 下的资源不带 vite base 前缀就会在生产 404（/login.jpg 被 nginx 转给旧后端），
        # 而构建与组件测试都不会报错——2026-09 的登录页就是漏在这里。检查同时扫源码与产物。
        run: pnpm run build:check
      - name: 单元测试（路由守卫分级 / 账号隔离存储 / 渲染）
        # 第 6 轮审核 H3：原先只跑 test:component，tests/unit 整个目录不在门禁内——
        # router-guard（守卫分级）、user-scoped-storage（隔离存储）、inference-render
        # 都只在实施者本机跑过。vitest 的 include 是 tests/**/*.test.ts，这里与下面的
        # 组件测试合起来覆盖全部用例。
        run: pnpm run test:unit
      - name: 组件测试（四个 CRUD 页的加载/提交 + 关键页面挂载 + 资源路径）
        # 旧前端原先零测试（2026-09-25 S3-4）：这四个页面是 R1-1 的请求链路与 FE-4
        # 的抽函数对象，钉住底线后再动它们。
        run: pnpm run test:component
      - name: 生产包不得包含 mockjs（FE-1 回归）
        run: |
          if grep -rl "MockXMLHttpRequest\|mockjs" dist/assets/ 2>/dev/null; then
            echo "::error::生产产物里出现 mockjs：检查 src/main.ts 的 DEV 守卫"
            exit 1
          fi
          echo "产物干净"
