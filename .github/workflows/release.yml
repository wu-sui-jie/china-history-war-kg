name: release

# 发布门禁（2026-09-16 第五轮审核 P2-7 整改）。
#
# 与旧版的区别：
# - 所有内联 heredoc 都移到了 scripts/ 下的脚本，YAML 里不再出现未缩进的多行 Python
#   （旧文件正是因此解析失败：GitHub 0 秒 failure、无 jobs）；
# - smoke 失败不再被 `|| true` 吞掉：任一门禁失败都阻断发布；
# - 数据制品必须带预期 sha256 才允许解包（可再加 gpg 签名），并做 zip-slip 与范围检查；
# - release 包补齐源码、dist、数据、eval/demo、证据与 SBOM。
on:
  workflow_dispatch:
    inputs:
      data_artifact_url:
        description: "数据制品（snapshot/index/eval 的 zip）下载地址；留空则从 RELEASE_DATA_URL Secret 读"
        required: false
        default: ""
      data_artifact_sha256:
        description: "数据制品的预期 SHA-256（64 位十六进制，必填；与 --sha256 语义一致）"
        required: true
      data_artifact_signature_url:
        description: "可选的 gpg 分离签名文件地址（给了就必须同时给公钥，否则拒绝）"
        required: false
        default: ""
      data_artifact_pubkey_url:
        description: "验签公钥地址（与签名配套；也可用 RELEASE_DATA_PUBKEY Secret）"
        required: false
        default: ""
      version:
        description: "数据版本（如 20260915_v1）"
        required: true
        default: "20260915_v1"
  push:
    tags: ["v*"]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG
    # 这里**不设**生产档（`RAG_REQUIRE_ACTIVE_VERSION=true`）——第 14 轮审计 P1-2 的修法。
    #
    # 原因：生产档会连带打开鉴权门禁（`RAG_AUTH_MODE=disabled` 在生产档下**拒绝启动**），
    # 而本 pipeline 的冒烟、契约与浏览器验收都按"匿名可访问"写的（RAG 前端在独立浏览器
    # 上下文里没有旧后端签发的 token）。于是原配置下的"启动服务"必然失败，其后每一步
    # 跟着失败——整个发布链是**必挂**的，而文档只说它"仍待手动触发演练"。
    #
    # 为什么选"去掉生产档"而不是"补上鉴权档"：后者要给 smoke_deploy / test:contract /
    # Playwright 三套工具都接上凭证（得先在 CI 里造一张旧后端的 JWT），改动面远大于它验证的
    # 东西；而**生产配置的正确性本来就该由部署门禁管**——`deploy/scripts/check_rag_auth.sh`
    # 在安装期校验鉴权档、两侧密钥同值、nginx 认证真实生效、只监听回环。
    # 本 pipeline 的职责是"数据制品 + 代码能产出一个可发布的包"（血缘/SBOM/冒烟/契约/清单）。
    #
    # 生产档本身仍被下面那一步**反向验证**：配置成"生产 + disabled"必须被拒绝启动。
    env:
      # CORS 显式放行通配：本 pipeline 用浏览器验收真实服务，来源是 runner 上的
      # 临时端口，收窄白名单没有意义；显式表态可避免 health 里出现"通配 CORS"告警。
      ALLOW_PUBLIC_CORS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生产档门禁仍然有效（反向验证：生产 + 未配鉴权必须被拒）
        # 这条的作用是"别让上面那段注释变成一句没有执行者的声明"：
        # 哪天有人把 auth_startup_problem 的生产判定删掉，这里会红。
        # 不用 heredoc：本文件以前的解析失败正是因为 YAML 里出现了内联多行 Python
        # （见文件头第 2 条），这里沿用同文件既有写法（单条 python -c）。
        env:
          RAG_REQUIRE_ACTIVE_VERSION: "true"
          # 显式清空，避免"runner 上恰好配了鉴权"造成假通过
          RAG_AUTH_MODE: ""
          RAG_REQUIRE_AUTH: ""
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from config.settings import get_settings
          problem = get_settings().auth_startup_problem()
          assert problem, '生产档下未配鉴权却没有被拒绝——鉴权门禁失效了'
          print('生产档 + 未配鉴权被拒（预期）：', problem[:80])
          "
      - name: 解析数据版本（tag 触发时取 tag 名，缺失则用默认值）
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"        # v20260915_v1 → 20260915_v1
          fi
          version="${version:-20260915_v1}"
          echo "RAG_ACTIVE_VERSION=$version" >> "$GITHUB_ENV"
          echo "数据版本: $version"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 工作区必须干净（发布门禁的基础）
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::工作区存在未提交改动，禁止发布"; git status --short; exit 1
          fi

      - name: 恢复数据制品（预期哈希 + 安全解包）
        env:
          DATA_URL: ${{ github.event.inputs.data_artifact_url }}
          DATA_URL_SECRET: ${{ secrets.RELEASE_DATA_URL }}
          DATA_SHA: ${{ github.event.inputs.data_artifact_sha256 }}
          DATA_SHA_SECRET: ${{ secrets.RELEASE_DATA_SHA256 }}
          SIG_URL: ${{ github.event.inputs.data_artifact_signature_url }}
          PUBKEY_URL: ${{ github.event.inputs.data_artifact_pubkey_url }}
          PUBKEY_SECRET: ${{ secrets.RELEASE_DATA_PUBKEY }}
        run: |
          url="${DATA_URL:-$DATA_URL_SECRET}"
          sha="${DATA_SHA:-$DATA_SHA_SECRET}"
          if [ -z "$url" ]; then
            echo "::error::未提供数据制品地址：data/（snapshot、index、eval）约 210MB，不入 Git。"
            echo "::error::请用 workflow_dispatch 的 data_artifact_url，或配置 RELEASE_DATA_URL Secret"
            exit 1
          fi
          if [ -z "$sha" ]; then
            echo "::error::必须提供预期 SHA-256（输入 data_artifact_sha256 或 Secret RELEASE_DATA_SHA256）"
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *) echo "::error::数据制品地址必须是 https（哈希能防篡改，但机密性需要 TLS）"; exit 1 ;;
          esac
          mkdir -p .tmp
          sig_args=""
          if [ -n "$SIG_URL" ]; then
            # 验签必须闭合信任链（第五轮整改复核 B7）：只给签名不给公钥时
            # gpg 会去翻 runner keyring，验过的其实是"runner 上恰好有谁的钥匙"
            pubkey="${PUBKEY_URL:-$PUBKEY_SECRET}"
            if [ -z "$pubkey" ]; then
              echo "::error::给了签名就必须同时提供公钥（data_artifact_pubkey_url 或 RELEASE_DATA_PUBKEY）"
              exit 1
            fi
            curl -fsSL "$SIG_URL" -o .tmp/data.zip.sig
            curl -fsSL "$pubkey" -o .tmp/pubkey.asc
            sig_args="--signature .tmp/data.zip.sig --pubkey .tmp/pubkey.asc"
          fi
          python scripts/fetch_data_artifact.py --url "$url" --sha256 "$sha" \
            --dest . --allow-prefix data/ $sig_args

      - name: 安装依赖（锁文件 + 哈希强制）
        run: |
          pip install --upgrade pip
          if [ -f requirements-dev.lock ] && grep -q -- '--hash=' requirements-dev.lock; then
            pip install --require-hashes -r requirements-dev.lock
          else
            echo "::error::requirements-dev.lock 缺少 --hash=：发布链路不接受无哈希依赖"
            exit 1
          fi
          cd RAG/frontend && npm ci

      - name: 后端全量测试
        run: python -m pytest tests -q

      - name: 前端 verify（typecheck + unit + component + build + bundle）
        working-directory: RAG/frontend
        run: npm run verify

      - name: 启动服务（后续浏览器/冒烟/契约步骤共用）
        run: |
          nohup python scripts/run_server.py --port 8125 --version "$RAG_ACTIVE_VERSION" \
            > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8125/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8125/api/health | python -m json.tool | head -30

      - name: 版本来源必须是 cli_explicit（P0-4 验收）
        run: |
          sel=$(curl -sf http://127.0.0.1:8125/api/health | python -c "import json,sys; print(json.load(sys.stdin).get('version_selection',''))")
          echo "version_selection=$sel"
          if [ "$sel" != "cli_explicit" ]; then
            echo "::error::--version 启动时 health 必须显示 cli_explicit，实际为 $sel"
            exit 1
          fi

      - name: 浏览器验收（真实服务 + desktop/mobile）
        working-directory: RAG/frontend
        run: |
          npx playwright install --with-deps chromium
          RAG_BASE_URL=http://127.0.0.1:8125 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: RAG/frontend/playwright-report/
          retention-days: 7

      - name: 服务冒烟（失败即阻断，不再 || true）
        run: |
          python scripts/smoke_deploy.py --base http://127.0.0.1:8125 \
            --report logs/smoke_release.json

      - name: 契约端到端（SSE / 缓存 / 400 / 同源托管）
        working-directory: RAG/frontend
        run: npm run test:contract -- --base http://127.0.0.1:8125

      - name: demo 接口必须可用（P2-1 验收）
        run: |
          code=$(curl -s -o /tmp/demo.json -w "%{http_code}" http://127.0.0.1:8125/api/demo/examples)
          head -c 400 /tmp/demo.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::/api/demo/examples 返回 $code：demo 制品与运行时版本不一致"
            exit 1
          fi

      - name: 密钥扫描与文档一致性（发布前必须复跑，D6）
        run: |
          python scripts/check_secrets.py
          python scripts/check_docs.py --strict

      - name: 生成血缘、Chroma 审计、SBOM 与制品清单
        run: |
          python scripts/build_lineage.py --version "$RAG_ACTIVE_VERSION"
          python scripts/build_lineage.py --check
          python scripts/audit_chroma_segments.py --version "$RAG_ACTIVE_VERSION"
          python scripts/gen_sbom.py generate --version "$RAG_ACTIVE_VERSION"
          python scripts/gen_sbom.py validate
          python scripts/build_artifact_manifest.py build --version "$RAG_ACTIVE_VERSION" --require-clean
          python scripts/build_artifact_manifest.py verify
          python scripts/build_artifact_manifest.py verify-sums

      - name: Playwright 产物不得污染 clean 门禁（R5-4 验收）
        run: |
          git status --porcelain -- ':!new' > /tmp/status.txt
          if [ -s /tmp/status.txt ]; then
            echo "::error::浏览器用例运行后工作区变脏："; cat /tmp/status.txt; exit 1
          fi
          echo "工作区仍干净"

      - name: 组装完整 release 包
        run: |
          python scripts/build_release_bundle.py --version "$RAG_ACTIVE_VERSION" \
            --smoke-report logs/smoke_release.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            RAG/release/
            RAG/release.tar.gz
            RAG/release.tar.gz.sha256
          retention-days: 30

      - name: 停止服务并检查退出日志
        if: always()
        run: |
          pkill -f "scripts/run_server.py" || true
          echo "--- server.log 末尾 ---"
          tail -40 /tmp/server.log || true
