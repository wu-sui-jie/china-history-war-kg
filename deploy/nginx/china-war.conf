# 干戈纪略 —— 生产入口（nginx）
#
# 安装（Ubuntu / Debian）：
#   sudo cp deploy/nginx/china-war.conf /etc/nginx/sites-available/china-war.conf
#   sudo ln -sf /etc/nginx/sites-available/china-war.conf /etc/nginx/sites-enabled/china-war.conf
#   sudo rm -f /etc/nginx/sites-enabled/default      # 避免默认站点抢占 80 端口
#   sudo nginx -t && sudo systemctl reload nginx
#
# 路径与端口约定见 docs/集成与入口约定.md 第二节：
#   浏览器  /           → 旧前端首页（frontend/dist/index.html）
#   浏览器  /static/*   → 旧前端静态资源（vite base = /static/）
#   浏览器  /rag/*      → RAG 服务（页面与接口同前缀，proxy_pass 末尾斜杠去掉 /rag）
#   浏览器  其余路径     → 旧后端 Flask :5000（含 /api/*）
#
# 两个后端进程都只监听 127.0.0.1，对外只有本文件定义的入口。

upstream china_war_backend { server 127.0.0.1:5000; }
upstream rag_backend       { server 127.0.0.1:8000; }

server {
    listen 80;
    listen [::]:80;

    # ↓↓↓ 改成你的域名；只用 IP 访问就填公网 IP
    server_name your.domain.or.ip;

    client_max_body_size 16m;

    access_log /var/log/nginx/china-war.access.log;
    error_log  /var/log/nginx/china-war.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 1. 旧管理台静态资源（vite base = /static/）----------
    # dist/index.html 里引用的是 /static/assets/...、/static/login.jpg、/static/icon/...
    # 注意：这里不要加 try_files —— alias 与 try_files 同用时 $uri 会与 alias 拼接错位
    location /static/ {
        alias /opt/china-war/frontend/dist/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- 2. 首页 ----------
    # 前端是 hash 路由（/#/knowledge/rag），除首页外没有别的服务端路径
    location = / {
        root /opt/china-war/frontend/dist;
        try_files /index.html =404;
        # 入口页不缓存，否则前端更新后用户仍拿到旧页面
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        root /opt/china-war/frontend/dist;
        add_header Cache-Control "no-cache";
    }
    # 浏览器自动请求的 /favicon.ico 在 dist 根目录，资源带 /static/ 前缀
    location = /favicon.ico {
        alias /opt/china-war/frontend/dist/favicon.ico;
        access_log off;
    }

    # ---------- 3. RAG 问答（页面 + 接口都在 /rag/ 下）----------
    # proxy_pass 末尾的斜杠就是“去掉 /rag 前缀”，正好对上 RAG 自身的 /* 与 /api/*
    location = /rag {
        return 301 /rag/;
    }
    location /rag/ {
        proxy_pass http://rag_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式回答：任何缓冲都会让回答“憋住不出字”
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # RAG 的 SSE_MAX_DURATION_SECONDS 默认 300，这里留足余量
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 可选：RAG 自身没有登录鉴权（见 deploy/README.md 第九节）。
        # 若服务器要对公网开放，建议至少加一道口令：
        #   sudo htpasswd -c /etc/nginx/.htpasswd china-war
        # auth_basic           "china-war";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # ---------- 4. 旧后端（含 /api/* 与旧版问答）----------
    location / {
        proxy_pass http://china_war_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 旧版问答也是 SSE 流式（/api/ai/inference/stream），同样不能缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ---------- 可选：HTTPS ----------
# 有域名后执行：sudo apt install certbot python3-certbot-nginx
#               sudo certbot --nginx -d your.domain
# 证书配好后，把上面 server 块里的 RAG 环境变量 CORS_ALLOW_ORIGINS 改成 https://your.domain
