# entity-event-relation 的包定义（包名 war_extraction）。
#
# 做成正式包、而不是靠改 sys.path 导入，是为了这三件事：
#   - 包名取 `war_extraction` 而非顶层的 `src`（`src` 极易与别的项目撞名），
#     实体在 `war_extraction.models` 等路径下；
#   - backend 以正常依赖方式引用它（`pip install -e entity-event-relation`），
#     依赖方向显式可查，不往 sys.path 里塞目录；
#   - 依赖按实际 import 声明，不靠根 requirements.txt 的"顺带安装"。
#
# 安装（开发态，可编辑）：
#   pip install -e entity-event-relation
#
# 注意：本包是仓库内部的离线抽取/评估模块，不发布到 PyPI；版本号与
# war_extraction/config.py 的 EXTRACTION_VERSION（产物 metadata 用的那个）互不干涉。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "war-extraction"
version = "0.1.0"
description = "历史战争知识抽取与评估（离线）"
# 下界 3.8 是留给 CI 里旧后端那一档 3.8（过渡期双跑）安装本包用的；
# 实际运行版本以仓库统一的 3.11 为准。
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "python-dotenv>=0.19",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.20",
    "tqdm>=4.60",
    "pandas>=1.3",
    "openpyxl>=3.0",
]

[tool.setuptools.packages.find]
include = ["war_extraction*"]
