# entity-event-relation 正式打包（P2-4 / BE-4 / EER-7 收口）。
#
# 为什么要有这个文件：本模块此前没有包定义，backend 只能把 entity-event-relation 目录塞进
# sys.path 再 `from src.models import ...`——顶层的 `src` 包名极易与别的项目撞名，且依赖方向
# 含糊（谁引用谁说不清）。打包后：
#   - 包名 `war_extraction`（避开 `src`），实体后端在 `war_extraction.models` 等路径下；
#   - backend 以正常依赖方式引用它（`pip install -e ../entity-event-relation`），
#     删掉了 sys.path 注入（原 backend/eer_path.py）；
#   - 依赖按实际 import 声明，不再靠根 requirements.txt 里的"顺带安装"。
#
# 安装（开发态，可编辑）：
#   pip install -e entity-event-relation
#
# 注意：本包是仓库内部的离线抽取/评估模块，不发布到 PyPI；版本号与
# war_extraction/config.py 的 EXTRACTION_VERSION（产物 metadata 用的那个）互不干涉。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "war-extraction"
version = "0.1.0"
description = "历史战争知识抽取与评估（离线）"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "python-dotenv>=0.19",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.20",
    "tqdm>=4.60",
    "pandas>=1.3",
    "openpyxl>=3.0",
]

[tool.setuptools.packages.find]
include = ["war_extraction*"]
