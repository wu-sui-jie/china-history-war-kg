[pytest]
# 压掉一条与本项目无关的告警：导入 lark-oapi 会拉起 SDK 内部的 ExpiringCache，
# 它的清理协程从未被 await（`ExpiringCache._start_clear_cron was never awaited`），
# 触发时机随 GC 变动，会随机挂在某个用例名上。留着它只会淹没真正的告警。
# 其余告警一律不屏蔽——输出的干净程度要靠修代码，不靠 filterwarnings。
filterwarnings =
    ignore:coroutine 'ExpiringCache\._start_clear_cron' was never awaited:RuntimeWarning
