# 全仓库统一依赖声明。
#
# ## 这个文件是什么
#
# 四个模块（backend / RAG / feishu-bot / 抽取包 war_extraction）的依赖原本散在各自
# 的 requirements 文件里，"哪个模块要装什么"只存在于各文件的注释里。这里把它们收敛成
# 一处**按模块分组的声明**，并统一 Python 版本与几个关键库的主版本。
#
# ## 这个文件不是什么（请勿误读）
#
# **它本身不是锁文件**：这里声明的是版本区间与分组，锁定的精确版本在根
# `requirements.lock`（119 个包、带 sha256，生成脚本 `scripts/gen_unified_lock.py`）。
#
# ## 迁移状态（2026-09-25 实测）
#
# | 项 | 状态 |
# | --- | --- |
# | 四个模块统一 Python 3.11 | **已实测**：`china-war-py311`（3.11.16）上四套测试全绿（backend 218 / EER 109 / RAG 464 / 飞书 301），与 3.8 基线逐套一致 |
# | SQLAlchemy 2 兼容 | **已实测**：本机一直是 SQLAlchemy 2.x；`Query.get()` 已全部改 `db.session.get()`，CI 把 `LegacyAPIWarning` 当失败门禁 |
# | 可复现 lock | **已生成并验证**：空环境 `pip install --require-hashes -r requirements.lock` 后四套测试全绿 |
# | CI 双跑 3.8 / 3.11 | 已加（`legacy-backend` 矩阵），稳定后再删 3.8 那一档 |
# | py2neo → 官方 driver | **未做**：py2neo 只发布到 2021.2.4、未声明支持 3.12+，这是"统一到 3.11 就够、不要跳到 3.12"的主因 |
#
# ## 用法
#
#   pip install -e ".[dev]"          # 只装开发与测试工具
#   pip install -e ".[backend]"      # 旧后端
#   pip install -e ".[rag]"          # RAG 子系统（需要 >=3.11：chromadb 要求）
#   pip install -e ".[bot]"          # 飞书机器人
#   pip install -e ".[extract]"      # 离线抽取链
#   pip install -e ".[all]"          # 本机统一开发环境（推荐）
#
#   # 上面这一步**不含抽取链包本身**（它是仓库内的独立包，不是三方依赖），
#   # 而旧后端会 `import war_extraction`——漏装它后端直接起不来：
#   pip install -e entity-event-relation
#
#   # 要复现"验证过的那套版本"用 lock（四套测试已在此组合上全绿）：
#   pip install --require-hashes -r requirements.lock
#
# 四个模块仍然是**四个独立进程**，不是合并成一个程序——分组只是依赖声明，
# 不改变部署形态。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# 本发行包**不装任何可导入的代码**，只承载上面那份按模块分组的依赖声明
# （四个模块仍是四个独立进程，见「用法」一节）。
#
# 这一行是必需的，不是装饰：setuptools 的扁平布局自动发现会把这个仓库里的
# `RAG/`、`backend/`、`frontend/`、`deploy/` 视作多个顶层包，直接拒绝构建——
#
#   error: Multiple top-level packages discovered in a flat-layout:
#          ['RAG', 'deploy', 'backend', 'frontend']
#
# 后果是 `pip install -e ".[all]"` 在本仓库
# **根本执行不了**：它在干净环境上直接失败，而不是装完缺少依赖。显式声明空包列表
# 即可让构建器不去猜——真要装代码，装的是 `entity-event-relation` 那个包
# （它有自己的 pyproject 与 `include = ["war_extraction*"]`）。
[tool.setuptools]
packages = []

[project]
name = "china-war"
version = "0.1.0"
description = "干戈纪略 · 中国战争史知识库（旧后端 + RAG 问答 + 飞书机器人 + 离线抽取）"
readme = "README.md"
# 统一到 3.11（文档第十四节第 1 条）。上限留在 <3.13：
#   - chromadb 的原生依赖在 3.13 上尚未验证；
#   - lark-oapi 与 py2neo 的兼容性同样只验证到 3.11。
# 3.12/3.13 的验证是文档第十四节第 3 条说的"另建实验矩阵"，不在这里声明。
requires-python = ">=3.11,<3.13"

# 刻意不给顶层 dependencies：四个模块的运行依赖差异很大（RAG 要 chromadb 与
# fastapi，backend 要 Flask 与 py2neo），把它们全塞进顶层会让"最小可用安装"
# 变成一个几百 MB 的怪物。要全套就装 [all]，那是显式的选择。
dependencies = []

[project.optional-dependencies]

# ---- 旧后端（Flask :5000）----
# SQLAlchemy 2 与 Flask-SQLAlchemy 3 是**统一目标**：backend 当前在本机以
# SQLAlchemy 1.4 验证过，升到 2.0 需要先跑通那 101 项测试（见文件头说明）。
# 旧版 `Query.get()` 等用法在 2.0 下仍可用但会产生 LegacyAPIWarning，属已知项。
backend = [
    "Flask>=2.3,<4",
    "Flask-Cors>=5.0,<7",
    "Flask-SQLAlchemy>=3.0,<4",
    "SQLAlchemy>=2.0,<3",
    "Werkzeug>=3.0,<4",
    "PyJWT>=2.4,<3",
    # py2neo 是唯一的"必须留着的旧依赖"：替换成官方 driver 属文档第十三节的
    # 独立改造（新增 neo4j 依赖 + 适配层 + 真实 Neo4j 集成验证），不在这里顺手换。
    "py2neo>=2021.2.4,<2022",
    "ollama>=0.5,<1",
    "jieba>=0.42,<1",
    "python-dotenv>=0.21",
]

# ---- 离线抽取链的三方依赖（backend 的 /api/extract/* 与 entity-event-relation 共用）----
extract = [
    "openai>=1.0,<3",
    "pydantic>=2.0,<3",
    "Jinja2>=3.0",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.20",
    "tqdm>=4.60",
    "pandas>=1.3",
    "openpyxl>=3.0",
]

# ---- RAG 子系统（FastAPI :8000）----
# 版本下界刻意写得宽：RAG 的依赖由 RAG/requirements.txt 逐条审计并带哈希锁定
# （CI 用 `--require-hashes` 安装），这里只声明"装哪些包、主版本是多少"，
# 精确版本仍以 RAG 侧的锁文件为准，避免两处锁文件互相打架。
rag = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27,<1.0",
    "chromadb>=0.5",
    "pydantic>=2.0,<3",
    "numpy>=1.26,<3",
    "python-dotenv>=0.21",
]

# ---- 飞书机器人 ----
# lark-oapi **锁精确版本**（与 feishu-bot/requirements.txt 一致）：长连接客户端对
# 卡片回调帧的分发是 SDK 内部实现细节，升级可能静默改变行为，升级前必须回归按钮回调。
bot = [
    "lark-oapi==1.7.3",
    "httpx>=0.27,<1.0",
    "python-dotenv>=0.21",
]

# ---- 开发与测试工具 ----
# pytest / ruff 的版本钉死：门禁口径不该因为某次 `pip install -U` 而漂移
# （CI 里同样钉死，见 .github/workflows/ci.yml 的注释）。
dev = [
    "pytest>=8.0,<10",
    "ruff==0.16.8",
    "flask>=2.3,<4",          # 后端测试需要（conftest 会在导入前替换 SQLite 路径）
]

all = [
    "china-war[backend]",
    "china-war[extract]",
    "china-war[rag]",
    "china-war[bot]",
    "china-war[dev]",
]

# ## 关于可复现 lock
#
# 根 `requirements.lock` **已生成并验证**：
#
#   python scripts/gen_unified_lock.py     # 生成 + 补哈希 + 自检
#   python scripts/gen_unified_lock.py --check   # 只校验（CI 用）
#
# 生成顺序是"先全绿再锁"：lock 固定的是**验证通过的那套版本组合**，
# 反过来先锁再验，锁住的是一个尚未验证的组合、看起来可复现实际不可信。
# RAG 自己那份带哈希的 `RAG/requirements.lock` 保持独立、不与本锁互相覆盖。


# ================== Ruff 配置 ==================
#
# ## 为什么必须有这一段
#
# 全仓此前**没有任何 ruff 配置**，于是 ruff 用**自己的默认规则集**跑，
# 而默认规则集在不同版本之间会变：0.14.4 → 0.16.8 之间扩大了。
# 实测同一命令、同一目录，只换版本：
#
#     ruff 0.14.4（CI 的 RAG / 飞书 job）  →  All checks passed!
#     ruff 0.16.8（pyproject 与本机 3.8 环境）→  RAG 480 errors / 飞书 74 errors
#
# 两个版本各自恰好装在不同的本机环境里，**本地怎么跑都不会暴露差异**——这正是
# 差异长期没被发现的原因。直接"把 CI 的版本号从 0.14.4 改成 0.16.8"会让 RAG 的 lint
# job 当场变红；正确顺序是先把规则集写死，再统一版本。
#
# ## 为什么 select 就写这四条
#
# `E4, E7, E9, F` 就是 0.14.4 的默认规则集（pycodestyle 的错误子集 + Pyflakes），
# 也是本仓库 CI 一直实际执行的那一套。写死它 = **把现有门禁口径冻结下来**，
# 让它不再随 ruff 版本漂移；统一到 0.16.8 之后判定与今天完全一致。
#
# 新默认集里多出来的 550 余条（UP045 `Optional[X]`→`X | None` 204 条、UP006、
# I001 导入排序、RUF100 无用 noqa…）**属于风格现代化，刻意不纳入门禁**：
# 一次性改 550 处会让"哪一处改动引入了回归"变得无法归因。其中确实有几类形状像 bug 的
# （B023 闭包捕获循环变量、PLW1510 subprocess 未给 check=、DTZ005 不带时区的 now()），
# 需要按类别单独处理，不要与功能改动混在同一次提交里。
#
# ## 作用范围
#
# ruff 从被检查文件所在目录向上找最近的 `pyproject.toml`/`ruff.toml`：
# `backend/`、`RAG/`、`feishu-bot/` 都没有自己的配置文件，因此统一落到这一段。
# `entity-event-relation/pyproject.toml` 存在，会**遮蔽**本段（该模块的 lint 只跑
# `--select F821`，显式 select 优先于配置，不受影响）。
[tool.ruff]
# 声明被检查代码的语法下限（旧后端与抽取链要能在 3.8 上跑），而不是"本机解释器版本"。
target-version = "py38"

[tool.ruff.lint]
# 只有这四条（= ruff 0.14.4 的默认集，也就是 CI 一直实际执行的那套）。
# 放在 [tool.ruff.lint] 而不是顶层的 `select`：后者在新版 ruff 里已废弃并会告警。
# 刻意**不**写 line-length：E501 不在 select 里，写上去会让人以为行长被检查。
select = ["E4", "E7", "E9", "F"]
